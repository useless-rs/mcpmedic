<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="mcpmedic logo: a medic cross with a terminal prompt carved at its heart">
  <!-- Isotype v3 "the prompt cross": one solid symmetric cross (single bold
       silhouette), with the terminal > chevron formed by absence — the
       negative space is the verb. At 16 px the chevron fills in and the mark
       reads as a plain solid cross. -->
  <rect width="512" height="512" rx="112" fill="#0D1117"/>
  <rect x="206" y="96" width="100" height="320" rx="24" fill="#2EE6A8"/>
  <rect x="96" y="206" width="320" height="100" rx="24" fill="#2EE6A8"/>
  <path fill="#0D1117" d="M222 208 L280 256 L222 304 L222 280 L256 256 L222 232 Z"/>
</svg>
