<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 512 512" role="img" aria-label="mcpmedic favicon">
  <!-- Favicon tier: same cursor-cross construction, enlarged to 78% so the
       mark fills the tab; the 10-unit seams close below 32px and the mark
       reads as a solid cross — that collapse is the designed behavior. -->
