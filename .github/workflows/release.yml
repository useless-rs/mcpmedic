name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: mcpmedic-linux-x86_64.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: mcpmedic-linux-aarch64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: mcpmedic-macos-aarch64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: mcpmedic-macos-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: mcpmedic-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Archive (unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/mcpmedic mcpmedic
          tar czf ${{ matrix.archive }} mcpmedic README.md LICENSE
      - name: Archive (windows)
        if: runner.os == 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/mcpmedic.exe mcpmedic.exe
          7z a ${{ matrix.archive }} mcpmedic.exe README.md LICENSE
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
          generate_release_notes: true
